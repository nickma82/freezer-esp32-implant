; Host tests of the node-02 engine: `pio test -d host-test -e native` from src/esp32-c3-supermini--esphome/
; The sources under test live outside this project, so they are pulled in through build_src_filter (test_build_src).
[platformio]
test_dir = test
src_dir = src

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17 -Wall -Wextra
    -I../components/freezer_bus
    -I../../../protocol-decoding/esp-smartdevice-emulator-poc/lib/freezer_bus
    -I../../../protocol-decoding/esp-freezer-emulator-poc/lib/freezer_master
build_src_filter =
    -<*>
    +<../../components/freezer_bus/node02_engine.cpp>
    +<../../../../protocol-decoding/esp-smartdevice-emulator-poc/lib/freezer_bus/freezer_bus.cpp>
    +<../../../../protocol-decoding/esp-freezer-emulator-poc/lib/freezer_master/freezer_master.cpp>
