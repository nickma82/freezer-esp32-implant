# Freezer freezer implant: ESP32-C3 SuperMini acting as bus node 02.
esphome:
  name: freezer-implant

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# native USB-Serial/JTAG console (no UART bridge on the SuperMini)
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO
  logs:
    freezer: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:  # fallback hotspot if the Wi-Fi is unreachable
    ssid: "freezer-implant"
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components
    components: [freezer_bus]

freezer_bus:
  bus_pin: GPIO3  # TX+RX open-drain on UART1, 100 ohm series resistor
