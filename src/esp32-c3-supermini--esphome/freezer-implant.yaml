# Freezer implant: ESP32-C3 SuperMini acting as bus node 02.
esphome:
  name: freezer-implant

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# native USB-Serial/JTAG console (no UART bridge on the SuperMini)
logger:
  hardware_uart: USB_SERIAL_JTAG
  # a tag may only be quieted below the global level, so the global level is DEBUG
  level: DEBUG
  logs:
    component: INFO
    wifi: INFO
    api: INFO
    esp-idf: INFO
    # freezer stays at DEBUG; set it to INFO to quiet the bus logging

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # SuperMini: the badly matched chip antenna fails association at full TX power ("Auth Expired",
  # "Probe Request Unsuccessful" at -65 dBm); 8.5 dB is the common fix for this board
  output_power: 8.5dB
  ap:  # fallback hotspot if the Wi-Fi is unreachable
    ssid: "freezer-implant"
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components
    components: [freezer_bus]

freezer_bus:
  id: bus
  bus_pin: GPIO3  # TX+RX open-drain on UART1, 100 ohm series resistor
  # reply_delay_us: 420      # first answer byte this long after the slot byte (250..600)
  # status_interval: 10s     # periodic read of the freezer state
  # network_writes: true     # write IP/SSID/MAC to the freezer like the original box (group 48)

switch:
  - platform: freezer_bus
    superfrost:
      name: "SuperFrost"
    party:
      name: "Party mode"
    bus_transmit:
      name: "Bus transmit"

# set-point as a dropdown of the 14 values -28..-15 degC; the freezer_bus number platform (setpoint) is the alternative
select:
  - platform: freezer_bus
    setpoint:
      name: "Set-point"

sensor:
  - platform: freezer_bus
    temperature:
      name: "Temperature"
    power_fail_temperature:
      name: "Power-failure temperature"
    latency_median:
      name: "Reply latency median"
    latency_max:
      name: "Reply latency max"
    crc_errors:
      name: "CRC errors"
    echo_mismatches:
      name: "Echo mismatches"
    missed_slots:
      name: "Missed slots"

binary_sensor:
  - platform: freezer_bus
    door:
      name: "Door"
    door_alarm:
      name: "Door alarm"
    power_fail_alarm:
      name: "Power-failure alarm"
    bus_connected:
      name: "Bus connected"

# reboots only the C3; the freezer keeps running, the implant rejoins after ~30 s (also used by the testbench)
button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

text_sensor:
  - platform: freezer_bus
    freezer_version:
      name: "Freezer version"
    node01_version:
      name: "Node 01 version"
    model:
      name: "Model"
    phase:
      name: "Start-up phase"
