[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 460800
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
build_src_filter = +<*>
lib_deps = plerup/EspSoftwareSerial@^8.1.0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Ilib/freezer_bus
lib_ignore = bus_uart_esp8266
